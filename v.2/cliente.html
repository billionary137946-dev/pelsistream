<style>
  *{margin:0;padding:0}
  html{max-width:100vw;overflow-x:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation}
  input{font-size:16px}
  button{-webkit-tap-highlight-color:transparent}

  .nav-item{position:relative;transition:color .2s ease}
  .nav-item .nav-ico{display:inline-block;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  .nav-item:active .nav-ico{transform:scale(.85)}
  .nav-item.active .nav-ico{transform:scale(1.18) translateY(-1px)}
  .nav-item::before{
    content:'';position:absolute;top:0;left:30%;right:30%;height:3px;
    background:var(--tw-gradient-stops,linear-gradient(90deg,#F5C800,#e6b800));
    border-radius:0 0 4px 4px;
    transform:scaleX(0);transition:transform .25s ease;
  }
  .nav-item.active::before{transform:scaleX(1)}
  .nav-item:hover{color:#F5C800}

  .btn-icon-tap:active{transform:scale(.92)}

  .tab-panel{
    position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    opacity:0;transform:translateY(10px) scale(.98);
    pointer-events:none;
    transition:opacity .3s cubic-bezier(.22,1,.36,1),transform .3s cubic-bezier(.22,1,.36,1);
  }
  .tab-panel.active{
    opacity:1;transform:translateY(0) scale(1);
    pointer-events:auto;
  }

  /* Scroll funcional pero sin barra visible (móvil y escritorio) */
  .tab-panel{ scrollbar-width:none; -ms-overflow-style:none; }
  .tab-panel::-webkit-scrollbar{ width:0; height:0; display:none; }

  @media (prefers-reduced-motion:reduce){
    .animate-logo{animation:none}
  }
</style>
</head>

  function _fmtDinero(n) {
    n = Number(n) || 0;
    return '$' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // Escapa texto antes de meterlo en innerHTML: el nombre de evento es texto
  // libre que un operador escribió — sin esto, un nombre de evento como
  // "<img src=x onerror=...>" se ejecutaría en el navegador del cliente que
  // ve su historial (XSS almacenado).
  function _escapeHtml(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // El celular y la URL propia llegan como variables de plantilla desde
  // codigo.gs (doGet → _servir), no se leen de window.top.location: esa
  // lectura puede fallar por origen cruzado dentro de un iframe.
  var MI_CELULAR = '<?= celular ?>';
  var APP_URL = '<?= url ?>';
  var EMBED = '<?= embed ?>';
  var SESION_LISTA = false;

  // Navega la app: si estamos embebidos en Netlify, le pide a ESA página
  // (por postMessage) que cambie su iframe, para que la URL de arriba se
  // quede siempre en pelistream.netlify.app. Si no, navega normal.
  function _navegarApp(url) {
    if (EMBED === 'netlify') {
      window.top.postMessage({ tipo: 'pelistream-navegar', url: url }, '*');
    } else {
      window.top.location.href = url;
    }
  }

  document.getElementById('btnSalir').addEventListener('click', function () {
    _navegarApp(APP_URL);
  });

  function _irALogin() {
    if (MI_CELULAR) _navegarApp(APP_URL);
  }

  // "Saldo" es el que le puso admin (nunca baja de $0 en la tarjeta); en
  // cuanto el cliente lo rebasa (saldo real negativo), aparece "Deuda" al
  // lado con lo que se pasó.
  function _pintarSaldo(saldo) {
    saldo = Number(saldo) || 0;
    document.getElementById('saldoMonto').textContent = _fmtDinero(Math.max(saldo, 0));

    var tarjetaDeuda = document.getElementById('tarjetaDeuda');
    if (saldo < 0) {
      document.getElementById('deudaMonto').textContent = _fmtDinero(Math.abs(saldo));
      tarjetaDeuda.classList.remove('hidden');
    } else {
      tarjetaDeuda.classList.add('hidden');
    }
  }

  // MODO PRUEBA: datos hardcodeados solo para ver cómo se ve la pantalla
  // fuera de Apps Script (donde no existe google.script.run).
  var _MOCK_SALDO = -350;
  var _MOCK_HISTORIAL = [
    { EVENTO: 'Palenque Central #3', Color: 'rojo', Monto: 1000, Neto: 1900, Resultado: 'ganada', Fecha: '01/08/2026 20:15' },
    { EVENTO: 'Palenque Central #2', Color: 'verde', Monto: 500, Neto: '', Resultado: 'perdida', Fecha: '01/08/2026 19:40' },
    { EVENTO: 'El Rancho #1', Color: 'rojo', Monto: 800, Neto: 800, Resultado: 'empate', Fecha: '31/07/2026 22:05' },
    { EVENTO: 'El Rancho #4', Color: 'verde', Monto: 1200, Neto: 1200, Resultado: 'cancelada', Fecha: '31/07/2026 21:30' },
    { EVENTO: 'La Palma #7', Color: 'rojo', Monto: 600, Neto: '', Resultado: '', Fecha: '31/07/2026 20:10' }
  ];

  function _iniciarSesion() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      document.getElementById('hdrUser').textContent = 'Juan (prueba)';
      _pintarSaldo(_MOCK_SALDO);
      _cacheHistorialCliente = _MOCK_HISTORIAL;
      _renderHistorialCliente();
      _iniciarPollingSaldo();
      return;
    }
    if (!MI_CELULAR) { _irALogin(); return; }

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) { _irALogin(); return; }
        SESION_LISTA = true;
        document.getElementById('hdrUser').textContent = res.alias || MI_CELULAR;
        _pintarSaldo(res.saldo);
        cargarHistorialCliente();
        _iniciarPollingSaldo();
      })
      .withFailureHandler(_irALogin)
      .validarSesion(MI_CELULAR, 'cliente');
  }

  // El saldo se actualiza solo, sin recargar la página, para que se refleje
  // en tiempo real cuando el operador registra o cierra una apuesta. En
  // MODO PRUEBA se simula moviendo el mock hacia arriba y abajo.
  //
  // _pollEnCurso evita pedidos encimados: con conexión mala, una consulta
  // puede tardar más de los 5s del intervalo — sin este candado, la
  // siguiente consulta saldría antes de que la anterior regrese, y si la
  // vieja responde después que la nueva, pintaría un saldo desactualizado.
  var _pollEnCurso = false;
  function _iniciarPollingSaldo() {
    setInterval(function () {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        _MOCK_SALDO += (Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 5) * 100);
        _pintarSaldo(_MOCK_SALDO);
        return;
      }
      if (_pollEnCurso) return; // sigue pendiente la consulta anterior: se salta este tick
      _pollEnCurso = true;
      google.script.run
        .withSuccessHandler(function (res) {
          _pollEnCurso = false;
          if (res && res.ok) _pintarSaldo(res.saldo);
        })
        .withFailureHandler(function () { _pollEnCurso = false; })
        .getSaldoCliente(MI_CELULAR);
    }, 5000);
  }

  function _tarjetaHistorialCliente(j) {
    var resultado = L(j.Resultado).toLowerCase();
    var badge = resultado === 'ganada'
      ? '<span class="text-[.65rem] font-extrabold uppercase px-2 py-1 rounded-full bg-green-500/15 text-green-300">Ganada</span>'
      : resultado === 'perdida'
        ? '<span class="text-[.65rem] font-extrabold uppercase px-2 py-1 rounded-full bg-red-500/15 text-red-300">Perdida</span>'
        : resultado === 'empate'
          ? '<span class="text-[.65rem] font-extrabold uppercase px-2 py-1 rounded-full bg-amber-500/15 text-amber-300">Empate</span>'
          : resultado === 'cancelada'
            ? '<span class="text-[.65rem] font-extrabold uppercase px-2 py-1 rounded-full bg-white/10 text-white/50">Cancelada</span>'
            : '<span class="text-[.65rem] font-extrabold uppercase px-2 py-1 rounded-full bg-amber-500/15 text-amber-300">Pendiente</span>';

    var color = L(j.Color).toLowerCase() === 'rojo' ? '🔴' : '🟢';
    var neto = j.Neto !== '' && j.Neto !== undefined ? _fmtDinero(j.Neto) : '—';

    return '<div class="bg-card border border-border/80 rounded-2xl p-4 mb-2 overflow-hidden">' +
      '<div class="flex items-center justify-between gap-2">' +
        '<div class="min-w-0">' +
          '<div class="font-bold truncate">' + _escapeHtml(j.EVENTO) + '</div>' +
          '<div class="text-white/40 text-xs mt-0.5 truncate">' + color + ' ' + _fmtDinero(j.Monto) + ' · Neto ' + neto + '</div>' +
        '</div>' +
        '<div class="flex-shrink-0">' + badge + '</div>' +
      '</div>' +
      '<div class="text-white/25 text-[.65rem] mt-2">' + _escapeHtml(j.Fecha) + '</div>' +
    '</div>';
  }

  var _cacheHistorialCliente = [];

  // La Fecha viene como "dd/mm/aaaa hh:mm" (toLocaleString('es-MX')); el
  // input type=date entrega "aaaa-mm-dd" — se convierte para poder comparar.
  function _fechaAISO(fechaStr) {
    var m = L(fechaStr).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return '';
    return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
  }

  function _renderHistorialCliente() {
    var q = document.getElementById('buscarHistorialCliente').value.trim().toLowerCase();
    var fecha = document.getElementById('filtroFechaHistorialCliente').value;
    var cont = document.getElementById('listaHistorialCliente');

    var filtrados = _cacheHistorialCliente.filter(function (j) {
      if (q && String(j.EVENTO || '').toLowerCase().indexOf(q) === -1) return false;
      if (fecha && _fechaAISO(j.Fecha) !== fecha) return false;
      return true;
    });

    if (!filtrados.length) {
      cont.innerHTML = '<div class="bg-card border border-border/80 rounded-2xl p-6 text-center text-white/30 text-sm">' +
        (q || fecha ? 'Sin resultados para ese filtro.' : 'Aún no tienes jugadas registradas.') + '</div>';
      return;
    }
    cont.innerHTML = filtrados.map(_tarjetaHistorialCliente).join('');
  }

  document.getElementById('buscarHistorialCliente').addEventListener('input', _renderHistorialCliente);
  document.getElementById('filtroFechaHistorialCliente').addEventListener('change', _renderHistorialCliente);

  function cargarHistorialCliente() {
    var cont = document.getElementById('listaHistorialCliente');
    if (!SESION_LISTA || typeof google === 'undefined' || !google.script || !google.script.run) return;

    google.script.run
      .withSuccessHandler(function (res) {
        _cacheHistorialCliente = (res && res.ok && res.jugadas) ? res.jugadas : [];
        _renderHistorialCliente();
      })
      .withFailureHandler(function () {
        _cacheHistorialCliente = [];
        cont.innerHTML = '<div class="bg-card border border-border/80 rounded-2xl p-6 text-center text-red-300 text-sm">No se pudo cargar tu historial.</div>';
      })
      .getHistorialCliente(MI_CELULAR);
  }

  _iniciarSesion();
</script>

</body>
</html>
